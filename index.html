async function fetchWeather(){
  const now = Date.now();
  if (weatherCache.txt && now - weatherCache.t < 5*60*1000) return weatherCache.txt;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`+

/* =================== GRABACIÓN (mantener apretado) =================== */
async function startRecording(){
  if (busy) return;
  cancelAudio();                 // barge-in: corta la respuesta actual
  stopReq = false;
  recChunks = [];
  try{
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    setStatus("No me diste acceso al micrófono", "err"); return;
  }
  mediaRecorder = new MediaRecorder(recStream);
  mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  mediaRecorder.onstop = onRecorded;
  mediaRecorder.start();

  if (stopReq){ try{ mediaRecorder.stop(); }catch(_){ } return; }

  setStatus("Grabando… soltá para enviar", "rec");
  talkBtn.classList.add("rec");
  micIcon.innerHTML = '<span class="bars"><i></i><i></i><i></i><i></i><i></i></span>';
  btnLabel.textContent = "SOLTÁ";
}

function stopRecording(){
  holdActive = false;
  talkBtn.classList.remove("rec");
  micIcon.textContent = "🎙️";
  btnLabel.textContent = "HABLAR";
  if (mediaRecorder && mediaRecorder.state !== "inactive"){
    setStatus("Enviando…");
    try{ mediaRecorder.stop(); }catch(_){}
  }
}

async function onRecorded(){
  const mime = (mediaRecorder && mediaRecorder.mimeType) || "audio/webm";
  const blob = new Blob(recChunks, { type: mime });
  recChunks = [];
  if (recStream){ recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  mediaRecorder = null;
  if (blob.size < 3000){ setStatus("No te escuché, probá de nuevo", "err"); return; }
  setStatus("Transcribiendo tu voz…");
  let text = "";
  try{
    text = await transcribe(blob);
  }catch(e){
    console.error(e);
    setStatus("Falló la transcripción (Groq): " + e.message, "err");
    return;
  }
  if (!text || !text.trim()){ setStatus("No entendí lo que dijiste", "err"); return; }
  await sendMessage(text.trim());
}

async function transcribe(blob){

  fd.append("model", "whisper-large-v3-turbo");
  fd.append("language", "es");
  fd.append("response_format", "json");
  fd.append("temperature", "0");
  let res = await fetch(STT_URL, { method:"POST", headers:{ Authorization:"Bearer " + GROQ_KEY }, body: fd });
  if (res.status === 404 || res.status === 400){   // fallback de modelo
    fd.set("model", "whisper-large-v3");
    res = await fetch(STT_URL, { method:"POST", headers:{ Authorization:"Bearer " + GROQ_KEY }, body: fd });
  }
  if (!res.ok){
    const t = await res.text();
    throw new Error("HTTP " + res.status + " " + t.slice(0,180));
  }
  const j = await res.json();
  return j.text || "";
}

/* =================== ELEVENLABS TTS =================== */
function cancelAudio(){
  ttsGen++;
  if (playingAudio){ try{ playingAudio.pause(); playingAudio.src=""; }catch(_){ } playingAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

function enqueueTTS(sentence, gen){
  const s = sentence.trim();
  if (!s) return;
  ttsChain = ttsChain.then(() => {
    if (gen !== ttsGen || muted) return;
    return speakEleven(s, gen);
  }).catch(() => {});
}

async function speakEleven(text, gen){
  try{
    const res = await fetch(TTS_URL, {
      method: "POST",
      headers: { "xi-api-key": ELEVEN_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ text, model_id: "eleven_multilingual_v2" })
    });
    if (!res.ok){
      const t = await res.text();
      throw new Error("HTTP " + res.status + " " + t.slice(0,180));
    }
    const blob = await res.blob();
    if (gen !== ttsGen || muted) return;
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    playingAudio = audio;
    setStatus("Sofi te está hablando…");
    await new Promise(resolve => {
      audio.onended = resolve;
      audio.onerror = resolve;
      audio.play().catch(resolve);
    });
    URL.revokeObjectURL(url);
    if (playingAudio === audio) playingAudio = null;
  }catch(e){
    console.warn("ElevenLabs falló, uso voz del sistema:", e);
    if (gen !== ttsGen || muted) return;
    if (!usingFallbackVoice){
      usingFallbackVoice = true;
      setStatus("⚠ ElevenLabs rechazó la voz (" + e.message.slice(0,80) + ") — respondo con voz del sistema", "err");
    }
    fallbackSpeak(text, gen);
  }
}

function fallbackSpeak(text, gen){
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "es-UY"; u.rate = 1.02; u.pitch = 1.08;
  u.onend = () => { if (gen === ttsGen && !muted) setStatus("Mantené apretado y hablá"); };
  speechSynthesis.speak(u);
}

/* =================== OPENROUTER (DeepSeek) =================== */
async function sendMessage(text){
  if (!text || busy) return;
  busy = true;
  talkBtn.classList.add("busy");
  btnLabel.textContent = "···";
  cancelAudio();
  ttsGen++;
  const gen = ttsGen;
  ttsChain = Promise.resolve();
  pendingSentence = "";

  addBubble("user", text);
  history.push({ role: "user", content: text });
  textInput.value = "";

  const bubble = addBubble("sofi", "…");
  bubble.classList.add("typing");
  setStatus("Sofi está pensando…");

  let full = "", reasoning = "";
  try{
    const sys = await buildSystem();
    const msgs = [{ role:"system", content: sys }];
    for (const m of history.slice(-40)){
      if (m.role === "assistant" && m.reasoning) msgs.push({ role:"assistant", content:m.content, reasoning:m.reasoning });
      else msgs.push({ role:m.role, content:m.content });
    }

    const res = await fetch(OR_URL, {
      method:"POST",
      headers:{ "Authorization":"Bearer " + OR_KEY, "Content-Type":"application/json" },
      body: JSON.stringify({ model: MODEL, stream:true, messages: msgs, reasoning:{ enabled:false } })
    });
    if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()).slice(0,300));

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", started = false;

    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines){
        const t = line.trim();
        if (!t.startsWith("data:")) continue;
        const data = t.slice(5).trim();
        if (data === "[DONE]") continue;
        let j; try{ j = JSON.parse(data); }catch(_){ continue; }
        const ch = j.choices && j.choices[0]; if (!ch) continue;
        const d = ch.delta || {};
        if (d.reasoning) reasoning += d.reasoning;
        if (d.content){
          if (!started){ started = true; bubble.classList.remove("typing"); bubble.textContent = ""; }
          full += d.content;
          bubble.textContent = full;
          chatDown();
          queueSentences(d.content, gen);
        }
      }
    }
    flushSentences(true, gen);

    if (!full){
      bubble.textContent = "…se me cortó la conexión, probá de nuevo.";
      bubble.classList.remove("typing");
    } else {
      bubble.textContent = full;
      const entry = { role:"assistant", content: full };
      if (reasoning) entry.reasoning = reasoning;
      history.push(entry);
    }
    setStatus(muted ? "Mantené apretado y hablá" : "Sofi te está hablando…");
  }catch(err){
    console.error(err);
    bubble.classList.remove("typing");
    if (!full) bubble.textContent = "Uy, tuve un error: " + err.message;
    setStatus("Error: " + err.message, "err");
    if (history.length && history[history.length-1].role === "user") history.pop();
  }finally{
    busy = false;
    talkBtn.classList.remove("busy");
    btnLabel.textContent = "HABLAR";
    chatDown();
    saveHist();
    if (history.filter(m => m.role === "user").length % 6 === 0) updateMemory();
    ttsChain.then(() => {
      if (!busy && gen === ttsGen && !muted) setStatus("Mantené apretado y hablá");
    });
  }
}

/* corta el streaming en frases y las manda a ElevenLabs de a una (en orden) */
let pendingSentence = "";
function queueSentences(chunk, gen){
  if (muted) return;
  pendingSentence += chunk;
  const re = /[^.!?…\n]+[.!?…\n]+(\s*)/g;
  let m, last = 0;
  while ((m = re.exec(pendingSentence))){
    const s = m[0].trim();
    if (s.length > 1) enqueueTTS(s, gen);
    last = m.index + m[0].length;
  }
  pendingSentence = pendingSentence.slice(last);
}
function flushSentences(final, gen){
  if (!final) return;
  const rest = pendingSentence.trim();
  pendingSentence = "";
  if (rest && !muted) enqueueTTS(rest, gen);
}

/* =================== BOTÓN (mantener apretado) =================== */
talkBtn.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (busy) return;
  holdActive = true;
  startRecording();
});
["pointerup","pointercancel","pointerleave"].forEach(ev =>
  talkBtn.addEventListener(ev, e => { e.preventDefault(); if (holdActive) stopRecording(); })
);
talkBtn.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("pointerup", () => { if (holdActive) stopRecording(); });

talkBtn.addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && !e.repeat && !busy){
    e.preventDefault(); holdActive = true; startRecording();
  }
});
talkBtn.addEventListener("keyup", e => {
  if (e.key === " " || e.key === "Enter"){ e.preventDefault(); if (holdActive) stopRecording(); }
});

/* =================== controles =================== */
voiceBtn.addEventListener("click", () => {
  muted = !muted;
  voiceBtn.textContent = muted ? "🔇" : "🔊";
  if (muted) cancelAudio();
  else setStatus("Mantené apretado y hablá");
});
function sendFromInput(){ const v = textInput.value.trim(); if (v) sendMessage(v); }
sendBtn.addEventListener("click", sendFromInput);
textInput.addEventListener("keydown", e => { if (e.key === "Enter") sendFromInput(); });

/* intro: si hay charla guardada la restauramos, si no, saludo tranquilo */
if (history.length){
  for (const m of history) addBubble(m.role === "user" ? "me" : "sofi", m.content);
  setStatus("Seguimos donde dejamos");
} else {
  addBubble("sofi", "Hola Ima, ¿qué tal? Contame cómo andás.");
}

/* borrar chat y memoria */
document.getElementById("clearBtn").addEventListener("click", () => {
  history = []; memoria = "";
  try{ localStorage.removeItem(HIST_KEY); localStorage.removeItem(MEM_KEY); }catch(_){}
  chatEl.innerHTML = "";
  addBubble("sofi", "Hola Ima, ¿qué tal? Contame cómo andás.");
  setStatus("Empezamos de nuevo");
});
</script>
